{% extends "base.html" %}

{% block title %}Terminal - Nima Manaf{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.4.0/css/xterm.css">
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
    }
    .terminal-page {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #1a1a1a;
    }
    .terminal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
        background: #2a2a2a;
        border-bottom: 1px solid #3a3a3a;
        flex-shrink: 0;
    }
    .terminal-header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
        color: #e0e0e0;
    }
    .terminal-header a {
        color: #888;
        text-decoration: none;
        font-size: 0.875rem;
    }
    .terminal-header a:hover {
        color: #e0e0e0;
    }
    .terminal-status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        color: #888;
    }
    .status-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #666;
    }
    .status-indicator.connected {
        background: #4ade80;
    }
    .status-indicator.disconnected {
        background: #f87171;
    }
    .status-indicator.connecting {
        background: #facc15;
    }
    #terminal-container {
        flex: 1;
        padding: 0.5rem;
        overflow: hidden;
    }
    .terminal-error {
        display: none;
        padding: 1rem;
        margin: 1rem;
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid #f87171;
        border-radius: 6px;
        color: #f87171;
    }
    .terminal-error.visible {
        display: block;
    }
</style>
{% endblock %}

{% block content %}
<div class="terminal-page">
    <header class="terminal-header">
        <h1>Terminal</h1>
        <div class="terminal-status">
            <span class="status-indicator" id="status-indicator"></span>
            <span id="status-text">Connecting...</span>
        </div>
        <a href="/dashboard">&larr; Dashboard</a>
    </header>
    <div id="terminal-error" class="terminal-error"></div>
    <div id="terminal-container"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.4.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
<script>
/**
 * Terminal client for nimamanafcom.
 *
 * Connects to WebSocket backend at /ws/terminal.
 * Uses xterm.js with fit addon for responsive sizing.
 * Handles reconnection and error display.
 */
(function() {
    'use strict';

    // DOM elements
    const container = document.getElementById('terminal-container');
    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');
    const errorDiv = document.getElementById('terminal-error');

    // Terminal setup
    const term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: 'Menlo, Monaco, "Courier New", monospace',
        theme: {
            background: '#1a1a1a',
            foreground: '#e0e0e0',
            cursor: '#e0e0e0',
            selection: 'rgba(255, 255, 255, 0.2)',
        },
    });

    const fitAddon = new FitAddon.FitAddon();
    const webLinksAddon = new WebLinksAddon.WebLinksAddon();

    term.loadAddon(fitAddon);
    term.loadAddon(webLinksAddon);
    term.open(container);

    // Initial fit
    fitAddon.fit();

    // WebSocket connection
    let ws = null;
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 5;

    function setStatus(status, text) {
        statusIndicator.className = 'status-indicator ' + status;
        statusText.textContent = text;
    }

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.classList.add('visible');
    }

    function hideError() {
        errorDiv.classList.remove('visible');
    }

    function getWebSocketUrl() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        return protocol + '//' + window.location.host + '/ws/terminal';
    }

    function connect() {
        setStatus('connecting', 'Connecting...');
        hideError();

        try {
            ws = new WebSocket(getWebSocketUrl());
        } catch (e) {
            showError('Failed to create WebSocket connection: ' + e.message);
            setStatus('disconnected', 'Connection failed');
            return;
        }

        ws.onopen = function() {
            setStatus('connected', 'Connected');
            reconnectAttempts = 0;
            hideError();

            // Send initial terminal size
            const dims = { cols: term.cols, rows: term.rows };
            ws.send(JSON.stringify({ type: 'resize', ...dims }));
        };

        ws.onmessage = function(event) {
            term.write(event.data);
        };

        ws.onclose = function(event) {
            setStatus('disconnected', 'Disconnected');

            if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 10000);
                setStatus('connecting', 'Reconnecting in ' + (delay/1000) + 's...');
                setTimeout(connect, delay);
            } else {
                showError('Connection lost. Please refresh the page to reconnect.');
            }
        };

        ws.onerror = function(error) {
            console.error('WebSocket error:', error);
            setStatus('disconnected', 'Error');
        };
    }

    // Send data from terminal to WebSocket
    term.onData(function(data) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(data);
        }
    });

    // Handle window resize
    let resizeTimeout;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function() {
            fitAddon.fit();
            if (ws && ws.readyState === WebSocket.OPEN) {
                const dims = { cols: term.cols, rows: term.rows };
                ws.send(JSON.stringify({ type: 'resize', ...dims }));
            }
        }, 100);
    });

    // Connect on page load
    connect();

    // Focus terminal on click
    container.addEventListener('click', function() {
        term.focus();
    });

    // Initial focus
    term.focus();
})();
</script>
{% endblock %}
