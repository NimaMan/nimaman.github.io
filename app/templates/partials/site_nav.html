<header class="site-header">
    <div class="site-shell site-header__inner">
        <a class="site-brand" href="/">{{ home_page.short_name }}</a>
        <nav class="site-nav" aria-label="Primary">
            <a href="/" class="{% if active_page == 'home' %}is-active{% endif %}">Home</a>
            <a href="/posts" class="{% if active_page == 'posts' %}is-active{% endif %}">Articles</a>
            <a href="/cv" class="{% if active_page == 'cv' %}is-active{% endif %}">CV</a>
            <a href="/#contact">Contact</a>
        </nav>
        <div class="site-meta-links" aria-label="Profile links">
            {% for link in social_links %}
            <a href="{{ link.href }}" class="site-meta-link" aria-label="{{ link.label }}" title="{{ link.label }}"{% if link.external %} target="_blank" rel="noreferrer"{% endif %}>
                <span aria-hidden="true">{{ link.symbol }}</span>
            </a>
            {% endfor %}
        </div>
    </div>
</header>
