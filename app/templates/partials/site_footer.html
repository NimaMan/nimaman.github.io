<footer class="site-footer">
    <div class="site-shell site-footer__inner">
        <div>
            <p class="site-footer__title">{{ home_page.short_name }}</p>
            <p class="site-footer__text">{{ home_page.tagline }}</p>
        </div>
        <div class="site-footer__links">
            {% for link in social_links %}
            <a href="{{ link.href }}"{% if link.external %} target="_blank" rel="noreferrer"{% endif %}>{{ link.label }}</a>
            {% endfor %}
        </div>
    </div>
</footer>
